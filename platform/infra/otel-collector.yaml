# Development collector. Applications speak OTLP to this and nothing else, so switching
# to a managed backend later is an exporter change here, not a code change anywhere.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20

exporters:
  # Local development: print to the collector's stdout.
  debug:
    verbosity: normal
  # Production: uncomment and point at the real backend. No application change required.
  # otlphttp/backend:
  #   endpoint: https://otlp.your-vendor.example
  #   headers: { authorization: "Bearer ${env:OTEL_TOKEN}" }

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
